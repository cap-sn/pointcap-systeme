function savedHtml(){if(Object.keys(S.fail).length)return '<span class="sv bad">Non enregistré</span> <button type="button" class="link" data-act="retry">Réessayer</button>';return S.savedTxt?'<span class="sv">'+(/^Enregistré/.test(S.savedTxt)?'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="vertical-align:-1px;margin-right:4px"><path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+esc(S.savedTxt)+'</span>':''}

function del(id){delete S.O[id];api('remove',{id:id})}
function list(type,all){return Object.keys(S.O).map(function(k){return S.O[k]}).filter(function(o){return o.type===type&&(all||!o.retire)}).sort(function(a,b){return (a.ordre||0)-(b.ordre||0)})}
function single(id,type){if(!S.O[id]){S.O[id]={type:type,id:id,origine:'declare',etat:'a_confirmer'}}return S.O[id]}

 return '<div class="field">'+lab(l,o2.req,o2.ex)+inp+'</div>'}

function fPrec(o,f,opts,sel,o2){if(o2.np)return '';var on=opts.some(function(x){return isAutre(x)&&(Array.isArray(sel)?sel.indexOf(x[0])>-1:sel===x[0])});return on?fTxt(o,o2.pf||(f+'_prec'),o2.pl||'Autre : précise',{req:0}):''}

 return '<div class="field">'+lab(l,o2.req,o2.ex)+'<select data-o="'+o.id+'" data-f="'+f+'" '+(o2.req?'data-req="1"':'')+(rr?' data-rr="1"':'')+'>'+h+'</select></div>'+fPrec(o,f,opts,v,o2)}

function effPoleOp(pid){var ps=list('poste').filter(function(x){return x.pole===pid&&x.intitule});var lie=ps.filter(function(x){return posteLie(x.id)});var arr=lie.length?lie:ps;return {postes:ps.length,personnes:arr.reduce(function(t,x){return t+(Number(x.effectif)||0)},0)}}
function extPoleN(pid){var a=extList(pid).filter(function(x){return x.reg!=='non'});return {n:a.length,pers:a.reduce(function(t,x){return t+(Math.max(1,Number(x.nb)||1))},0)}}
function effData(){var rows=list('pole').map(function(p){var o=effPoleOp(p.id),x=extPoleN(p.id);return {p:p,postes:o.postes,pers:o.personnes,ext:x.n,extp:x.pers}});var pi=rows.reduce(function(t,r){return t+r.pers},0),pe=rows.reduce(function(t,r){return t+r.extp},0);return {rows:rows,pi:pi,pe:pe,tot:pi+pe+1}}

function calcTrans(){var out=[];
 list('etape').forEach(function(e){var l=S.O[e.livrable];if(!l||!l.nom||!e.responsable)return;
  intrantsDe(e).forEach(function(i){var from='';

   else if(i.prov_type==='etape'&&S.O[i.prov_src])from=S.O[i.prov_src].responsable;
   if(!from||from===e.responsable||(from!=='dirigeant'&&!S.O[from]&&!isXAct(from)))return;
   out.push({key:'tr_'+i.id,de:from,vers:e.responsable,nom:i.nom||'(sans nom)',livrable:l.id,etape:e.id,forme:i.forme,delai:i.delai,bloq:i.oblig==='non',src:'intrant',srcLiv:i.prov_type==='livrable'?i.prov_src:''})})});

  if(d.genre==='poste')to=d.cible;else if(d.genre==='pole')to=respPoste(d.cible);else if(d.genre==='dir')to='dirigeant';
  if(!from||!to||from===to)return;if(out.some(function(t){return t.src==='intrant'&&t.srcLiv===l.id&&t.de===from&&t.vers===to}))return;out.push({key:'tr_'+d.id,de:from,vers:to,nom:l.nom,livrable:l.id,bloq:false,src:'dest'})});
 /* échanges déclarés hors chaîne (entre pôles) */
 list('echange').forEach(function(x){if(!x.nom||!x.pole_a||!x.pole_b)return;var a=respPoste(x.pole_a),b=respPoste(x.pole_b);
  if(x.sens==='envoie'||x.sens==='deux')out.push({key:'tr_'+x.id+'a',de:a||('pole:'+x.pole_a),vers:b||('pole:'+x.pole_b),nom:x.nom,livrable:x.livrable,bloq:false,src:'echange',ech:x.id});
