<style>
/* Mise en page : une colonne de saisie, une barre d'avancement fixe en haut, une question par bloc.
   Identité : charte PointCap (fond crème, Bleu Encre, Vert Cèdre, Ocre ; Montserrat et Inter), avec une variante sombre fidèle à la charte. */
:root{--bg:#F4F1EA;--surface:#FFFFFF;--ink:#1E2B37;--muted:#5B666F;--line:#D8D2C2;--brand-blue:#1E2B37;--brand-green:#3B5B4C;--accent:#3B5B4C;--accent-ink:#FFFFFF;--accent-soft:#E6ECE5;--warn:#C98A4B;--warn-soft:#FFFFFF;--bad:#B03A2E;--bad-soft:#F7E4E1;--good:#3B5B4C;--t1:#3B5B4C;--t2:#2F6DB5;--t3:#C98A4B;--t4:#1E2B37;--t5:#B0437F;--t6:#2A7F86;
--display:'Montserrat','Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17222C;--surface:#1E2B37;--ink:#F4F1EA;--muted:#AEB6BC;--line:#34444F;--brand-blue:#F4F1EA;--brand-green:#8FB3A0;--accent:#8FB3A0;--accent-ink:#12201A;--accent-soft:#25382F;--warn:#D9A56B;--warn-soft:#2B241A;--bad:#E58E83;--bad-soft:#3A2220;--good:#9CC5AA;--t1:#8FB3A0;--t2:#6FA2E0;--t3:#E0A86A;--t4:#C9D3DC;--t5:#E07FB5;--t6:#7CC4CB;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17222C;--surface:#1E2B37;--ink:#F4F1EA;--muted:#AEB6BC;--line:#34444F;--brand-blue:#F4F1EA;--brand-green:#8FB3A0;--accent:#8FB3A0;--accent-ink:#12201A;--accent-soft:#25382F;--warn:#D9A56B;--warn-soft:#2B241A;--bad:#E58E83;--bad-soft:#3A2220;--good:#9CC5AA;--t1:#8FB3A0;--t2:#6FA2E0;--t3:#E0A86A;--t4:#C9D3DC;--t5:#E07FB5;--t6:#7CC4CB;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-block:0 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
main,.bar-in{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:30px}h2{font-size:23px;margin-bottom:6px}h3{font-size:18px}
p{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.wide{max-width:1040px}.rhead h1{margin-bottom:4px}.rtabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px;position:sticky;top:46px;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.rtabs button{border-radius:999px}.rtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.rtabs .pdf{margin-left:auto}
.rs{display:none}.rs.on{display:block}.ptitle{display:none}.rl{margin:4px 0 0 18px;padding:0}.rl li{margin:3px 0}.rb h4{margin:16px 0 4px;font-size:14px}
details.card>summary{cursor:pointer;list-style:revert}.mapbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.legend{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px}.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.mapw{overflow-x:auto}.map{max-width:none;height:auto;display:block;margin:0 auto}.map text{font:500 13.5px var(--fb);fill:var(--ink)}.map .sub{font-size:11px;fill:var(--muted)}
.map .nd rect,.map .nd circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}.map .nd.pole{cursor:pointer}.map .nd.pole circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}.map .nd.resp circle{stroke:var(--warn);stroke-width:3}.map .nd.pole:hover circle,.map .nd.pole:focus circle,.map .nd.ext:hover rect{stroke-width:3}.map .nd.ext{cursor:pointer}.map .nd.ext text{font-size:12px}
.map .hier{stroke:var(--line);stroke-width:1.5}.map .edge path{fill:none;stroke-width:2}.map .edge circle{fill:var(--bg);stroke:currentColor;stroke-width:1.2}.map .edge text{font-size:11px;font-weight:600;fill:currentColor}
.e-liv{color:var(--accent)}.e-comp{color:var(--t2)}.e-rem{color:var(--warn)}.e-val{color:var(--t5)}.map .edge path{stroke:currentColor}.e-comp path{stroke-dasharray:7 4}.e-rem path{stroke-dasharray:2 4}.e-val path{stroke-dasharray:10 3 2 3}
.mk-liv{fill:var(--accent)}.mk-comp{fill:var(--t2)}.mk-rem{fill:var(--warn)}.mk-val{fill:var(--t5)}
.sw{display:inline-block;width:26px;border-top:3px solid}.sw-liv{border-color:var(--accent)}.sw-comp{border-color:var(--t2);border-top-style:dashed}.sw-rem{border-color:var(--warn);border-top-style:dotted}.sw-val{border-color:var(--t5);border-top-style:dashed}
@media print{.rs{display:block!important;break-before:page}.rs:first-of-type{break-before:auto}.ptitle{display:block}.rtabs,.noprint{display:none!important}details.card>*{display:block}.mapw{overflow:visible}.map{width:100%!important}}
.mx{overflow-x:auto}.mx td.mx-seul{background:var(--accent-soft)}.mx td.mx-inf{background:color-mix(in srgb,var(--warn) 18%,transparent)}.mx td.mx-val{background:color-mix(in srgb,var(--warn) 38%,transparent)}.card.seance{cursor:pointer}.card.seance:hover{border-color:var(--accent)}.tp{border-left:5px solid var(--tc);padding:2px 0 2px 14px;margin:34px 0 14px}.tp .tn{display:block;font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tc)}.tp h2{margin:2px 0 4px}.tp p{margin:0}
.t1{--tc:var(--t1)}.t2{--tc:var(--t2)}.t3{--tc:var(--t3)}.t4{--tc:var(--t4)}.t5{--tc:var(--t5)}.t6{--tc:var(--t6)}@media print{.bar,.noprint,.actions{display:none!important}body{background:#fff}.card{break-inside:avoid;box-shadow:none}}
.tz{border-left:3px solid var(--tc);padding-left:12px;margin-left:2px}
.barbtns{margin-left:auto;display:flex;gap:14px}.barbtns .link{font-size:13px;white-space:nowrap}
.bar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .t{font-family:var(--display);font-weight:600;font-size:15px;flex:1;min-width:0}
.sf{color:var(--brand-blue)}.nm{color:var(--brand-green)}
.bar .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.prog{flex-basis:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
main{padding-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.field{margin-bottom:18px}.field:last-child{margin-bottom:0}
label.q{display:block;font-weight:600;margin-bottom:2px}
.opt{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.ex{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bad input,.bad select,.bad textarea,.bad .multi{border-color:var(--bad)}
.msg{color:var(--bad);font-size:13.5px;margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 180px;min-width:0}
.radios{display:flex;gap:18px;flex-wrap:wrap}.radios label{display:flex;align-items:center;gap:6px}
.multi{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--bg);display:flex;flex-wrap:wrap;gap:4px 16px}
.multi label{display:flex;align-items:center;gap:6px;font-size:15px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.link{border:0;background:none;color:var(--accent);padding:4px 2px;text-decoration:underline}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.blockhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.blockhead h3{font-size:16px}.tools{display:flex;gap:4px}.tools button{padding:4px 9px;font-size:14px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 13px;font-size:14.5px;margin-bottom:16px}
.warn{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);border-radius:6px;padding:10px 13px;font-size:14.5px;margin-bottom:12px}
.err{background:var(--bad-soft);border-left:3px solid var(--bad);border-radius:6px;padding:10px 13px;font-size:14.5px;margin-bottom:12px}
.seance{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seance h3{margin-bottom:2px}.pill{font-size:12.5px;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.done{background:var(--accent);color:var(--accent-ink)}
.sum dt{font-weight:600;margin-top:10px}.sum dd{margin:2px 0 0;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.saved{font-size:12.5px;color:var(--muted)}
.login{max-width:400px;margin:12vh auto 0}
button.chip{border-radius:99px;padding:7px 14px;display:inline-flex;gap:8px;align-items:center;margin:0 6px 8px 0}button.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}button.chip b{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
details.multi-d summary{cursor:pointer;color:var(--accent);font-size:14.5px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;display:block;overflow-x:auto}table.t td,table.t th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .3s}}
</style>
<div id="app"></div>
<script>
'use strict';
/* ---------- configuration ---------- */
var CFG={API_URL:'https://script.google.com/macros/s/AKfycbzIS-xIrJLjSS14PAyBujl1qA2jJlJrp15G72DedlXyRwdRsOd_SBWUB0OHq12-XYJ5/exec',NOM_AFFICHE:'Atelier Mercier'}; // vide = mode démonstration (données dans le navigateur)
/* ---------- utilitaires ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9)}
function titre(nom){return '<span class="sf">Le système de fonctionnement</span> <span class="nm">'+esc(nom==null?S.nom:nom)+'</span>'}
var $app=document.getElementById('app');
var S={code:'',token:'',nom:'',O:{},view:'login',seance:null,step:0,sub:0,role:'dirigeant',pole:null,lastAct:Date.now(),secs:{},saving:0};
var mem={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
/* ---------- API (réel ou démonstration) ---------- */
var DEMO_SEED=function(){var o={};function add(t,i,f){f.type=t;f.id=i;f.origine='diagnostic';f.etat='a_confirmer';o[i]=f}
 add('pole','po1',{nom:'Commercial',ordre:1});add('pole','po2',{nom:'Livraison',ordre:2});add('pole','po3',{nom:'Administration',ordre:3});
 add('poste','pt1',{intitule:'Responsable commercial',pole:'po1',ordre:1});add('poste','pt2',{intitule:'Chargé d\'affaires',pole:'po1',ordre:2});
 add('poste','pt3',{intitule:'Responsable livraison',pole:'po2',ordre:3});add('poste','pt4',{intitule:'Chef de projet',pole:'po2',ordre:4});add('poste','pt5',{intitule:'Concepteur',pole:'po2',ordre:5});
 add('poste','pt6',{intitule:'Gestionnaire administratif',pole:'po3',ordre:6});return o};
function mock(action,p){
 var key='sfo_demo';var db=null;var raw=lsGet(key);try{db=JSON.parse(raw||'null')}catch(e){if(raw)lsSet('sfo_demo_corrompu',raw)}
 if(!db){db={nom:'Atelier Mercier',O:DEMO_SEED()}}
 function persist(){lsSet(key,JSON.stringify(db))}
 if(action==='login'){var R={'DEMO':{role:'dirigeant'},'DEMO-COM':{role:'responsable',pole:'po1'},'DEMO-LIV':{role:'responsable',pole:'po2'},'DEMO-ADM':{role:'responsable',pole:'po3'},'DEMO-EQ':{role:'lecteur'}};var ro=R[String(p.code).toUpperCase()];if(ro&&p.pwd==='demo'){persist();return {ok:true,nom:db.nom,token:'demo',objets:ro.role==='lecteur'?visLecteur(db.O):db.O,role:ro.role,pole:ro.pole||null}}return {ok:false,erreur:'Code ou mot de passe incorrect.'}}
 if(action==='save'){db.O[p.objet.id]=p.objet;persist();return {ok:true}}
 if(action==='remove'){delete db.O[p.id];persist();return {ok:true}}
 if(action==='rappel'){return {ok:true,demo:true}}
 if(action==='inviter'){return {ok:true,code:'DEMO-R'+(String(p.pole).slice(-1)||'1'),mdp:'demo-demo-demo',lien:'https://pointcap-systeme.stevennawe.com',mail:false}}
 if(action==='reset'){lsSet(key,'');return {ok:true}}
 return {ok:false,erreur:'Action inconnue.'}}
function api(action,payload){payload=payload||{};payload.token=S.token;payload.code=S.code;
 if(!CFG.API_URL)return Promise.resolve(mock(action,payload));
 var body=JSON.stringify(Object.assign({action:action},payload));
 return fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}).then(function(r){return r.json()}).catch(function(){return {ok:false,erreur:'Connexion impossible. Vos réponses ne sont pas perdues : réessayez dans un instant.'}})}
/* ---------- enregistrement ---------- */
var timers={};
function flushAll(){Object.keys(timers).forEach(function(k){clearTimeout(timers[k]);delete timers[k];if(S.O[k])save(k,true)})}
function stepIdx(sc,k){var st=STEPS[sc]||[];for(var i=0;i<st.length;i++)if(st[i].k===k)return i;return 0}
function subDe(sc,idx,t){var st=(STEPS[sc]||[])[idx];if(!st||!st.each)return 0;var its=[];try{its=st.each()}catch(e){}var m=String(t).match(/« ([^»]+) »/);if(!m)return 0;var nm=m[1].trim();for(var i=0;i<its.length;i++)if((its[i].nom||its[i].intitule)===nm)return i;return 0}
function ptsHtml(pts,ctx){if(!pts||!pts.length)return '';ctx=ctx||{};
 return '<div class="warn"><strong>Points à préciser plus tard</strong> (rien d\'obligatoire pour continuer) :<ul style="margin:6px 0 0 18px;padding:0">'+pts.map(function(t){var li='<li style="margin-bottom:4px">'+esc(t);
  if(ctx.s&&ctx.rules){var k=null;for(var i=0;i<ctx.rules.length;i++)if(ctx.rules[i][0].test(t)){k=ctx.rules[i][1];break}
   if(k){var ix=stepIdx(ctx.s,k);li+=' <button type="button" class="link" data-act="goto" data-s="'+ctx.s+'" data-pole="'+(ctx.pole||'')+'" data-step="'+ix+'" data-sub="'+subDe(ctx.s,ix,t)+'">Aller à cet écran</button>'}}
  return li+'</li>'}).join('')+'</ul></div>'}
function barBtns(){if(S.view==='login')return '';return (CFG.API_URL?'':'<button type="button" class="link" data-act="sauv">Sauvegarde</button>')+(S.view==='step'||S.view==='recap'?'<button type="button" class="link" data-act="quit">Enregistrer et quitter</button>':'')+'<button type="button" class="link" data-act="logout">Se déconnecter</button>'}
function stamp(o){o.maj=new Date().toISOString();return o}
function save(id,now){var o=S.O[id];if(!o)return;stamp(o);clearTimeout(timers[id]);
 var go=function(){S.saving++;showSaved('Enregistrement…');api('save',{objet:o}).then(function(r){S.saving--;showSaved(r&&r.ok?'Enregistré':(r&&r.erreur)||'Non enregistré')})};
 if(now)go();else timers[id]=setTimeout(go,500)}
function showSaved(t){var e=document.getElementById('saved');if(e)e.textContent=t}
function put(type,fields){var id=uid(type.slice(0,2));var o=Object.assign({type:type,id:id,origine:'declare',etat:'a_confirmer',ordre:nextOrdre(type)},fields||{});S.O[id]=o;save(id,true);return o}
function nextOrdre(type){var m=0;list(type,true).forEach(function(o){m=Math.max(m,o.ordre||0)});return m+1}
function del(id){delete S.O[id];api('remove',{id:id})}
function list(type,all){return Object.keys(S.O).map(function(k){return S.O[k]}).filter(function(o){return o.type===type&&(all||!o.retire)}).sort(function(a,b){return (a.ordre||0)-(b.ordre||0)})}
function single(id,type){if(!S.O[id]){S.O[id]={type:type,id:id,origine:'declare',etat:'a_confirmer'}}return S.O[id]}
/* ---------- champs ---------- */
var ENT={};
function lab(l,req,ex){return '<label class="q">'+esc(l)+(req?'':'<span class="opt">facultatif</span>')+'</label>'+(ex?'<span class="ex">'+esc(ex)+'</span>':'')}
function fTxt(o,f,l,o2){o2=o2||{};var v=o[f]||'';var inp=o2.area?'<textarea data-o="'+o.id+'" data-f="'+f+'" '+(o2.req?'data-req="1"':'')+'>'+esc(v)+'</textarea>':'<input type="text" data-o="'+o.id+'" data-f="'+f+'" '+(o2.req?'data-req="1"':'')+' value="'+esc(v)+'" autocomplete="off">';
 return '<div class="field">'+lab(l,o2.req,o2.ex)+inp+'</div>'}
function fSel(o,f,l,opts,o2){o2=o2||{};var v=o[f]||'';var h='<option value="">Choisir…</option>'+opts.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>'}).join('');
 return '<div class="field">'+lab(l,o2.req,o2.ex)+'<select data-o="'+o.id+'" data-f="'+f+'" '+(o2.req?'data-req="1"':'')+(o2.rr?' data-rr="1"':'')+'>'+h+'</select></div>'}
function fMulti(o,f,l,opts,o2){o2=o2||{};var v=o[f]||[];
 return '<div class="field">'+lab(l,o2.req,o2.ex)+'<div class="multi" data-multi="1" data-o="'+o.id+'" data-f="'+f+'" '+(o2.req?'data-req="1"':'')+(o2.rr?' data-rr="1"':'')+'>'+opts.map(function(x){return '<label><input type="checkbox" value="'+esc(x[0])+'"'+(v.indexOf(x[0])>-1?' checked':'')+'> '+esc(x[1])+'</label>'}).join('')+'</div></div>'}
function fRadio(o,f,l,opts,o2){o2=o2||{};var v=o[f]||'';
 return '<div class="field">'+lab(l,o2.req,o2.ex)+'<div class="radios" data-radio="1" '+(o2.req?'data-req="1"':'')+' data-o="'+o.id+'" data-f="'+f+'">'+opts.map(function(x){return '<label><input type="radio" name="'+o.id+f+'" value="'+esc(x[0])+'" data-o="'+o.id+'" data-f="'+f+'"'+(x[0]===v?' checked':'')+(o2.rr?' data-rr="1"':'')+'> '+esc(x[1])+'</label>'}).join('')+'</div></div>'}
/* ---------- listes de choix ---------- */
var L_ECH=[['t','Ce trimestre'],['6m','D\'ici 6 mois'],['12m','D\'ici 12 mois'],['2-3a','D\'ici 2 à 3 ans']];
var L_UNI=[['nombre','Nombre'],['eur','€'],['pct','%'],['jours','Jours'],['autre','Autre']];
var L_FREQ=[['sem','Chaque semaine'],['mois','Chaque mois'],['trim','Chaque trimestre'],['an','Chaque année']];
var L_PLACE=[['dev','À développer en priorité'],['cons','À conserver'],['evol','À faire évoluer'],['red','À réduire']];
var L_CTR=[['budget','Budget'],['effectif','Effectif et disponibilité'],['regl','Réglementaire ou juridique'],['delai','Délai imposé'],['outils','Outils et données'],['client','Client ou partenaire clé'],['autre','Autre']];
var L_NB=[['1','Une'],['2-3','Deux ou trois'],['3+','Plus de trois'],['0','Aucune aujourd\'hui']];

 list('pole').forEach(function(p){if(p.resp==='aucun')pts.push('Le pôle « '+p.nom+' » n\'a pas de responsable aujourd\'hui.')});
 list('poste').forEach(function(x){if(x.remplacant==='aucun'&&((Number(x.effectif)||0)<=1))pts.push('Le poste « '+x.intitule+' » n\'a pas de remplaçant.');
  if(x.remplacant&&x.remplacant!=='aucun'&&x.remplacant!=='meme'&&S.O[x.remplacant]&&S.O[x.remplacant].remplacant===x.id&&x.id<x.remplacant)pts.push('Les postes « '+x.intitule+' » et « '+posteNom(x.remplacant)+' » se remplacent mutuellement : qui prend le relais si les deux sont absents ?')});
 list('objectif').forEach(function(o){if(!o.ind_cible)pts.push('L\'objectif « '+(o.intitule||'')+' » n\'a pas de cible chiffrée.')});
 return pts}

function rsSvgPole(pid){var p=S.O[pid];if(!p)return '';var fl=rsFlux();var postes=list('poste').filter(function(x){return x.pole===pid&&x.intitule});
 var ext=['dirigeant'].concat(list('pole').filter(function(x){return x.id!==pid}).map(function(x){return x.id}));var W=Math.max(560,Math.max(postes.length,ext.length)*210+40);var pos={};
 ext.forEach(function(id,i){var g=(W-40)/ext.length;pos[id]={x:20+g*i+g/2,y:44,w:Math.min(150,g-14),h:34}});
 postes.forEach(function(x,i){var g=(W-40)/postes.length;var n=list('livrable').filter(function(l){return l.nom&&(respDe(l)===x.id||(l.producteurs||[]).indexOf(x.id)>-1)}).length;pos[x.id]={x:20+g*i+g/2,y:240,r:Math.min(64,54+n*3),n:n,p:x}});
 var by={};fl.forEach(function(f){var a=pos[f.de]?f.de:nodeOf(f.de),b=pos[f.vers]?f.vers:nodeOf(f.vers);if(!a||!b||a===b||!pos[a]||!pos[b])return;if(!(postes.some(function(x){return x.id===a||x.id===b})))return;var k=a+'>'+b+'>'+f.type;(by[k]=by[k]||{a:a,b:b,type:f.type,items:[]}).items.push(f)});
 var svg='<svg viewBox="0 0 '+W+' 380" style="width:'+W+'px" role="img" aria-label="Carte du pôle '+esc(p.nom)+'" class="map"><defs>'+Object.keys(RS_T).map(function(k){return '<marker id="ah-'+k+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-'+k+'"/></marker>'}).join('')+'</defs>';
 var cnt={};Object.keys(by).forEach(function(k){var e=by[k],A=pos[e.a],B=pos[e.b];var d,mx,my;cnt[e.a+e.b]=(cnt[e.a+e.b]||0)+1;var n=cnt[e.a+e.b];
  var aIn=!!A.r,bIn=!!B.r;
  if(aIn&&bIn){var cy=240+Math.max(A.r,B.r)+34+Math.abs(A.x-B.x)*0.1+n*13;d=arcPath(A.x,A.y+A.r,B.x,B.y+B.r,cy);mx=(A.x+B.x)/2;my=(A.y+A.r+2*cy+B.y+B.r)/4}
  else{var o=(n-1)*14-6;var x1=(aIn?A.x:A.x)+o,y1=aIn?A.y-A.r:A.y+17,x2=(bIn?B.x:B.x)+o,y2=bIn?B.y-B.r:B.y+17;d='M'+x1+','+y1+' L'+x2+','+y2;mx=(x1+x2)/2;my=(y1+y2)/2}
  svg+='<g class="edge e-'+e.type+'"><title>'+esc(e.items.map(function(f){return f.nom}).filter(function(v,i,a){return a.indexOf(v)===i}).join(' · '))+'</title><path d="'+d+'" marker-end="url(#ah-'+e.type+')"/><circle cx="'+mx+'" cy="'+my+'" r="9"/><text x="'+mx+'" y="'+(my+3.5)+'" text-anchor="middle">'+e.items.length+'</text></g>'});
 ext.forEach(function(id){var q=pos[id];var nm=id==='dirigeant'?'Le dirigeant':'Pôle '+poleNom(id);svg+='<g class="nd ext"'+(id!=='dirigeant'?' data-act="rniv" data-id="'+id+'" tabindex="0" role="button"':'')+'><rect x="'+(q.x-q.w/2)+'" y="'+(q.y-17)+'" width="'+q.w+'" height="34" rx="8"/><text x="'+q.x+'" y="'+(q.y+4)+'" text-anchor="middle">'+esc(nm)+'</text></g>'});
 postes.forEach(function(x){var q=pos[x.id];var isR=p.resp===x.id;svg+='<g class="nd pole'+(isR?' resp':'')+'"><circle cx="'+q.x+'" cy="'+q.y+'" r="'+q.r+'"/>'+nodeTxt(q.x,q.y,x.intitule,isR?'responsable du pôle':q.n+' livrable'+(q.n>1?'s':''))+'</g>'});
 return svg+'</svg>'}
function rsCarte(){var ps=list('pole');if(!ps.length)return '<div class="note">Aucun pôle validé pour l\'instant.</div>';
 var h='<div class="card noprint"><div class="mapbar"><label class="q" for="rniv">Niveau</label><select id="rniv" data-r="niv"><option value="ent"'+(RS.niv==='ent'?' selected':'')+'>Toute l\'entreprise</option>'+ps.map(function(p){return '<option value="'+p.id+'"'+(RS.niv===p.id?' selected':'')+'>Pôle '+esc(p.nom)+'</option>'}).join('')+'</select>'+
  '<label class="chk"><input type="checkbox" data-r="crit"'+(RS.crit?' checked':'')+'> Chemin critique seulement</label></div><div class="legend">'+
  Object.keys(RS_T).map(function(k){return '<label class="chk lg-'+k+'"><input type="checkbox" data-r="type" data-k="'+k+'"'+(RS.types[k]?' checked':'')+'> <i class="sw sw-'+k+'"></i>'+RS_T[k][0]+'</label>'}).join('')+'</div></div>';
 h+='<div class="card"><div class="mapw">'+(RS.niv==='ent'||!S.O[RS.niv]?rsSvgEnt():rsSvgPole(RS.niv))+'</div><p class="muted small" style="margin:8px 0 0">'+(RS.crit?'Chemin critique : seuls sont affichés les livrables à fort enjeu et ce dont ils dépendent. ':'')+'Sur téléphone, la carte se fait défiler horizontalement. Le chiffre sur une flèche indique le nombre d\'éléments échangés ; survoler une flèche en donne le détail. '+(RS.niv==='ent'||!S.O[RS.niv]?'Cliquer sur un pôle ouvre sa carte.':'Cliquer sur un autre pôle ouvre sa carte.')+'</p></div>';
 return h}
/* --- les pôles --- */
function rsPoles(){var ps=list('pole');if(!ps.length)return '<div class="note">Aucun pôle validé pour l\'instant.</div>';
 return ps.map(function(p){var postes=list('poste').filter(function(x){return x.pole===p.id&&x.intitule});var livs=list('livrable').filter(function(l){return l.pole===p.id&&l.nom});var d=trDuPole(p.id);
  var h='<details class="card" '+(ps.length===1?'open':'')+'><summary><h3 style="display:inline">'+esc(p.nom)+'</h3> <span class="muted small">· responsable : '+esc(posteNom(p.resp))+' · '+livs.length+' livrable'+(livs.length>1?'s':'')+'</span></summary>';
  h+='<div class="rb">'+(p.mission?'<p><strong>À quoi sert ce pôle.</strong> '+esc(p.mission)+'</p>':'')+(p.releve?'<p class="small"><strong>Il s\'occupe de :</strong> '+esc(p.releve)+'</p>':'')+(p.hors?'<p class="small"><strong>Il ne s\'occupe pas de :</strong> '+esc(p.hors)+'</p>':'');
  h+='<h4>Les postes</h4>'+rsLines(postes.map(function(x){return '<strong>'+esc(x.intitule)+'</strong> <span class="muted small">· '+(Number(x.effectif)||0)+' personne(s) · rend compte à '+esc(posteNom(posteSup(x.id)))+'</span>'}));
  if(livs.length)h+='<h4>Les livrables</h4><div class="mx"><table class="t"><tr><th>Livrable</th><th>Produit par</th><th>Pour</th><th>Rythme et délai</th><th>Il est bien fait quand</th></tr>'+livs.map(function(l){var cr=[l.crit1,l.crit2,l.crit3].filter(Boolean);
   return '<tr><td><strong>'+esc(l.nom)+'</strong>'+(critique(l)?' <span class="pill">Fort enjeu</span>':'')+'</td><td>'+esc(prodTxt(l))+'</td><td>'+esc(destsDe(l).map(destTxt).join(', '))+'</td><td>'+esc(lab2(L_RYTHME,l.rythme))+(l.delai?' · '+esc(l.delai==='autre'?(l.delai_autre||''):lab2(L_DELAI,l.delai).toLowerCase()):'')+'</td><td>'+(cr.length?'<ul class="rl">'+cr.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul>':'')+'</td></tr>'}).join('')+'</table></div>';
  var real=livs.filter(function(l){return l.chaine&&etapesDe(l).length});
  if(real.length)h+='<h4>Comment on réalise</h4>'+real.map(function(l){return '<p class="small" style="margin:6px 0 2px"><strong>'+esc(l.nom)+'</strong></p><ol class="rl">'+etapesDe(l).map(function(e){return '<li>'+esc(e.nom||'')+' <span class="muted small">· '+esc(posteNom(e.responsable))+(DUR_J[e.duree]!=null?' · '+esc(lab2(L_DUREE,e.duree).toLowerCase()):'')+'</span></li>'}).join('')+'</ol>'+(aiguillage(l)?'<p class="muted small" style="margin:2px 0">Circuits alternatifs : '+esc(aiguillage(l))+'</p>':'')}).join('');
  var crit=livs.filter(function(l){return critique(l)&&l.consequences});if(crit.length)h+='<h4>Si un livrable à fort enjeu dérape</h4>'+rsLines(crit.map(function(l){return '<strong>'+esc(l.nom)+'</strong> : '+esc(l.consequences)}));
  h+='<h4>Ce que le pôle reçoit</h4>'+rsLines(d.recoit.map(function(t){return esc(t.nom)+' <span class="muted small">· de '+esc(trNom(t.de))+(t.bloq||trObj(t).bloq==='oui'?' · indispensable pour avancer':'')+'</span>'}),'Rien de validé pour l\'instant.');
  h+='<h4>Ce que le pôle envoie</h4>'+rsLines(d.envoie.map(function(t){return esc(t.nom)+' <span class="muted small">· à '+esc(trNom(t.vers))+'</span>'}));
  var es=escListe(p.id);if(es)h+='<h4>Quand faire remonter</h4>'+es;
  return h+'</div></details>'}).join('')}
/* --- qui décide --- */
function rsDecide(){var ps=list('pole');var sel=RS.pole&&S.O[RS.pole]?RS.pole:null;
 var rows=matriceRows(sel).filter(function(x){return x.r.statut==='valide'});
 var h='<div class="card noprint"><div class="mapbar"><label class="q" for="rpole">Afficher</label><select id="rpole" data-r="pole"><option value="">Toute l\'entreprise</option>'+ps.map(function(p){return '<option value="'+p.id+'"'+(RS.pole===p.id?' selected':'')+'>Pôle '+esc(p.nom)+'</option>'}).join('')+'</select></div></div>';
 if(!rows.length)return h+'<div class="note">Aucune règle de décision n\'est validée pour l\'instant.</div>';
 var niv={seul:'mx-seul',informe:'mx-inf',valide:'mx-val'};
 h+='<div class="card"><div class="mx"><table class="t"><tr>'+(sel?'':'<th>Pôle</th>')+'<th>Livrable ou décision</th><th>Qui</th><th>Jusqu\'où il décide</th><th>Limite</th><th>Regard du dirigeant</th></tr>'+
  rows.map(function(x){var o=x.o,r=x.r,liv=o.type==='livrable';return '<tr>'+(sel?'':'<td>'+esc(x.p.nom)+'</td>')+'<td><strong>'+esc(o.nom)+'</strong>'+(liv&&critique(o)?' <span class="pill">Fort enjeu</span>':'')+'</td><td>'+esc(posteNom(liv?respDe(o):o.poste))+'</td><td class="'+(niv[r.niveau]||'')+'">'+esc(lab2(L_NIV,r.niveau))+'</td><td>'+(r.limite?esc(r.limite):'·')+'</td><td>'+esc(lab2(L_REG,r.regard))+'</td></tr>'}).join('')+'</table></div></div>'+
  '<p class="muted small">Décide seul : aucune autorisation à demander. Décide, puis informe : on agit puis on prévient. Propose, fait valider : on attend l\'accord avant d\'agir.</p>';
 return h}

function rsFiches(){var ps=list('poste').filter(function(p){return p.intitule});
 if(RS.fiche&&S.O[RS.fiche]){S.fiche=RS.fiche;S.fVue='titulaire';var h=ficheHtml().replace(/^<div class="noprint"[^>]*>[\s\S]*?<\/div>/,'');

 return '<p class="muted small">Chaque fiche décrit un poste, pas la personne. Si vous tenez ce poste et que quelque chose est inexact, vous pouvez proposer une correction depuis la fiche : le dirigeant la valide ou l\'écarte.</p>'+
  ps.map(function(p){return '<div class="card seance"><div><h3>'+esc(p.intitule)+'</h3><span class="muted small">Pôle '+esc(poleNom(p.pole))+'</span></div><div class="noprint"><button class="primary" data-act="rfiche" data-id="'+p.id+'">Voir la fiche</button></div></div>'}).join('')}
/* --- fonctionnement --- */
function rsFonct(){var h='';var rs=rituelsRetenus();
 h+='<div class="card"><h3>Nos rendez-vous réguliers</h3>'+(rs.length?'<table class="t"><tr><th>Rendez-vous</th><th>Fréquence</th><th>Animé par</th></tr>'+rs.map(function(r){return '<tr><td><strong>'+esc(r.nom||'')+'</strong><br><span class="small">'+esc(r.objectif||'')+'</span></td><td>'+esc(lab2(L_FREQ,r.freq))+'</td><td>'+esc(animeTxt(r))+'</td></tr>'}).join('')+'</table>':'<p class="muted small">Rien de validé pour l\'instant.</p>')+'</div>';
 var pr=principesListe().filter(function(o){return (o.etat==='retenu'||o.etat==='reformule')&&o.txt});if(pr.length)h+='<div class="card"><h3>Nos principes de réunion</h3>'+rsLines(pr.map(function(o){return esc(o.txt)}))+'</div>';
 if(S.O.pub_comm)h+='<div class="card"><h3>Comment nous communiquons</h3><table class="t"><tr><th>Échange</th><th>Canal</th><th>Délai</th></tr>'+CONV.map(function(c){var o=convObj(c);var d=c.ro==='urgence'?(delaiUrgence()||'à préciser'):c.ro==='valid'?(delaiValid()||'à préciser'):lab2(c.opt||L_DELAI,o.delai);return '<tr><td>'+esc(c.t)+'</td><td>'+esc(o.canal||'à préciser')+'</td><td>'+esc(d)+'</td></tr>'}).join('')+'</table></div>';
 var tv=list('pole').map(function(p){var a=tensActives(p.id).filter(function(o){return o.statut==='valide'});var hum=S.O['th_'+p.id];if(!a.length&&!hum)return '';
  return '<div class="card"><h3>Quand ça coince : pôle '+esc(p.nom)+'</h3>'+a.map(function(o){return '<p class="small" style="margin:8px 0 2px"><strong>'+esc(o.titre)+'</strong></p>'+tensResume(o)}).join('')+(hum?'<p class="small" style="margin:10px 0 2px"><strong>Le côté humain</strong></p>'+humResume(p.id):'')+'</div>'}).join('');
 h+=tv;if(tv)h+='<div class="note small">Les situations graves (harcèlement, discrimination, atteinte à la santé) ne relèvent pas de ces procédures internes. Elles se traitent selon le cadre légal, avec un interlocuteur extérieur à l\'équipe.</div>';
 var rr=relRetenus();if(rr.length)h+='<div class="card"><h3>Nos principes de relation</h3>'+rsLines(rr.map(function(o){return esc(o.txt)}))+'</div>';
 var rv=S.O.ch_rev;if(rv&&rv.statut==='valide')h+='<div class="card"><h3>Révision de la charte</h3><p class="small" style="margin:0">Relue '+esc(lab2([['6m','tous les six mois'],['an','une fois par an'],['chg','à chaque changement important d\'organisation']],rv.freq))+'. Peut être demandée à tout moment par : '+esc(posteNom(rv.qui))+'.</p></div>';
 return h||'<div class="note">Rien de validé pour l\'instant.</div>'}
function restitInner(prev){var body={cap:rsCap,carte:rsCarte,poles:rsPoles,decide:rsDecide,fiches:rsFiches,fonct:rsFonct};
 var h='<div class="rhead"><h1>'+esc(S.nom||'')+'</h1><p class="muted">Comment nous fonctionnons. Cette page se met à jour à chaque validation du dirigeant.</p></div>';
 if(prev)h+='<div class="warn noprint"><strong>Aperçu de la version de l\'équipe.</strong> Seul ce qui est validé apparaît ici. <button type="button" class="link" data-act="home">Revenir à mon espace</button></div>';
 h+='<nav class="rtabs noprint" aria-label="Rubriques">'+RS_TABS.map(function(t){return '<button type="button" data-act="rtab" data-t="'+t[0]+'"'+(RS.tab===t[0]?' class="on" aria-current="true"':'')+'>'+t[1]+'</button>'}).join('')+'<button type="button" class="pdf" data-act="fprint">Exporter en PDF</button></nav>';
 RS_TABS.forEach(function(t){h+='<section class="rs'+(RS.tab===t[0]?' on':'')+'" aria-label="'+t[1]+'"><h2 class="ptitle">'+t[1]+'</h2>'+body[t[0]]()+'</section>'});
 return h}
